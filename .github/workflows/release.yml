# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - "v*"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true
      # Imports the signing key with gpg directly: the repository's Actions
      # policy allows only GitHub-owned and verified actions, so a third-party
      # import action fails at startup. The passphrase is preset in gpg-agent
      # so GoReleaser can sign non-interactively.
      - name: Import GPG key
        id: import_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.TF_SIGNING_KEY }}
          PASSPHRASE: ${{ secrets.TF_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          gnupg_home="${GNUPGHOME:-$HOME/.gnupg}"
          mkdir -p "$gnupg_home"
          chmod 700 "$gnupg_home"
          echo "allow-preset-passphrase" >> "$gnupg_home/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          if [ -n "${PASSPHRASE:-}" ]; then
            preset="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
            for keygrip in $(gpg --batch --with-colons --with-keygrip --list-secret-keys | awk -F: '$1 == "grp" { print $10 }'); do
              printf '%s' "$PASSPHRASE" | "$preset" --preset "$keygrip"
            done
          fi
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
